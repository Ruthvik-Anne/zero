name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # T-TST-01: six targets, build + lint + test on each.
  matrix:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: build
        run: cargo build --workspace --all-targets --locked
      - name: lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace --locked
      - name: docs and traceability gates
        run: cargo run -p xtask --locked -- check-docs
      - name: architecture gate
        run: cargo run -p xtask --locked -- check-arch
      # Baselines are recorded on one reference machine; only that target enforces
      # the performance gate. Every target still builds, lints, and tests.
      - name: benchmark gate
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo run -p xtask --locked -- bench --check

  protocol-readers:
    name: protocol readers (Rust + TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rust golden fixture test
        run: cargo test -p zero-types proto::tests::golden_fixtures_decode_identically --locked
      - name: TypeScript reader
        run: node protocol/ts/check.mjs

  # T-PAR-01: the traceability check also runs on every documentation change.
  docs:
    name: traceability and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: check docs
        run: cargo run -p xtask --locked -- check-docs
      - name: docs index is current
        run: |
          cargo run -p xtask --locked -- docs-index --write
          git diff --exit-code docs/requirements-index.md
      - name: error and path tables are current
        run: |
          cargo run -p xtask --locked -- errors-doc --write
          cargo run -p xtask --locked -- paths-doc --write
          git diff --exit-code docs/errors.md docs/data-directories.md
