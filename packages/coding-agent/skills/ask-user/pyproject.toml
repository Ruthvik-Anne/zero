# Kernel-side package for the bundled ask-user skill. It only talks to the
# host through rlm.host_request; zero-runtime is always installed in
# the kernel venv before skills, so it is intentionally not declared as a
# dependency (it is not published on PyPI).
[project]
name = "ask_user"
version = "0.1.0"
description = "Zero ask-user skill: ask the human a structured question over the host bridge"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ask_user"]
