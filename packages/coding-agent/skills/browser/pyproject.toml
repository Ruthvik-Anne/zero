# Kernel-side package for the bundled browser skill. It only talks to the
# host through rlm.host_request; zero-runtime is always installed in
# the kernel venv before skills, so it is intentionally not declared as a
# dependency (it is not published on PyPI). The actual browser (Playwright) is
# a native TypeScript dependency of the host, not a Python dependency of this
# skill — this package is a thin typed wrapper, nothing more.
[project]
name = "browser"
version = "0.1.0"
description = "Zero browser automation skill: navigate/click/type/extract/screenshot over the host bridge"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/browser"]
