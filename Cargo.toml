[workspace]
resolver = "2"
members = [
  "crates/zero-types",
  "crates/zero-store",
  "crates/zero-policy",
  "crates/zero-actions",
  "crates/zero-fs",
  "crates/zero-tasks",
  "crates/zero-sched",
  "crates/zero-agent",
  "crates/zero-kernel",
  "crates/zero-model",
  "crates/zero-secrets",
  "crates/zero-web",
  "crates/zero-mcp",
  "crates/zero-review",
  "crates/zero-halcyon",
  "crates/zero-mesh",
  "crates/zero-mm",
  "crates/zero-tui",
  "crates/zero-daemon-app",
  "crates/zero-daemon",
  "crates/zero-doctor",
  "crates/zero-cli",
  "crates/zero-arch",
  "crates/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/zero/zero"

[workspace.dependencies]
zero-types = { path = "crates/zero-types" }
zero-store = { path = "crates/zero-store" }
zero-policy = { path = "crates/zero-policy" }
zero-actions = { path = "crates/zero-actions" }
zero-fs = { path = "crates/zero-fs" }
zero-tasks = { path = "crates/zero-tasks" }
zero-sched = { path = "crates/zero-sched" }
zero-agent = { path = "crates/zero-agent" }
zero-kernel = { path = "crates/zero-kernel" }
zero-model = { path = "crates/zero-model" }
zero-secrets = { path = "crates/zero-secrets" }
zero-web = { path = "crates/zero-web" }
zero-mcp = { path = "crates/zero-mcp" }
zero-review = { path = "crates/zero-review" }
zero-halcyon = { path = "crates/zero-halcyon" }
zero-mesh = { path = "crates/zero-mesh" }
zero-mm = { path = "crates/zero-mm" }
zero-tui = { path = "crates/zero-tui" }
zero-daemon-app = { path = "crates/zero-daemon-app" }
zero-daemon = { path = "crates/zero-daemon" }
zero-doctor = { path = "crates/zero-doctor" }
zero-cli = { path = "crates/zero-cli" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
blake3 = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
base64 = "0.22"
# Halcyon mode signatures (HAL-03). Pinned to the maintained 2.2 line: MSRV
# 1.81 and edition 2021 match this workspace, and it reuses the existing
# `sha2` 0.10 stack. 3.0 exists but pulls a parallel sha2 0.11 / signature 3 /
# curve25519-dalek 5 stack for the same primitive.
ed25519-dalek = "2.2"
keyring = "4.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "blocking", "rustls-tls"] }
tempfile = "3"
trash = "5"
unicode-width = "0.2"
unicode-segmentation = "1.12"
unicode-normalization = "0.1"
aes-gcm = "0.10"
argon2 = "0.5"
getrandom = "0.2"
sha2 = "0.10"
# T-TEL-03 end-to-end transfer. Pinned to the RustCrypto lines that share this
# workspace's existing digest 0.10, aead 0.5, and curve25519-dalek 4 stacks
# (sha2 0.10, aes-gcm 0.10, ed25519-dalek 2.2). The 2026 majors
# (x25519-dalek 3, chacha20poly1305 0.11, hkdf 0.13) need digest 0.11, aead 0.6,
# and curve25519-dalek 5, a second copy of the same primitives. `static_secrets`
# gives a seedable ephemeral key; `alloc` gives Vec ciphertext, and `getrandom`
# is off because nonces are derived rather than sampled.
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
hkdf = "0.12"
url = "2"
zeroize = "1"
zip = { version = "9.7.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# PDF text extraction only: pure Rust, MSRV 1.88, no C bindings. Default
# features (`rayon`, `chrono-clock`) are off because the reader extracts pages
# sequentially and never needs timestamps.
lopdf = { version = "0.47", default-features = false }
